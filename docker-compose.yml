# Runs the whole system locally: PostgreSQL + Spring Boot (serving the React build).
#   docker compose up --build      then open http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bloodbridge
      POSTGRES_USER: bloodbridge
      POSTGRES_PASSWORD: bloodbridge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloodbridge"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/bloodbridge
      SPRING_DATASOURCE_USERNAME: bloodbridge
      SPRING_DATASOURCE_PASSWORD: bloodbridge
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-secret-before-sharing}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bloodbridge.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
volumes:
  pgdata:
