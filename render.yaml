# Render Blueprint: one web service (Docker: React build served by Spring Boot) + managed PostgreSQL.
# Deploy: push this repo to GitHub, then Render dashboard > New > Blueprint > select the repo.
services:
  - type: web
    name: bloodbridge
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bloodbridge-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@bloodbridge.local
      - key: SEED_DEMO_DATA
        value: "true"
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC"
databases:
  - name: bloodbridge-db
    plan: free
    databaseName: bloodbridge
